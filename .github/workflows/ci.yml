name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  apply-search-review-fixes:
    name: Apply reviewed search fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/song-search-optimization-20260820'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/song-search-optimization-20260820
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply reviewed fixes
        run: python3 scripts/apply-search-review-fixes.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate reviewed fixes
        run: npm run verify
      - name: Commit validated application files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/search-ranking.js app/search-service.js
          git commit -m "Fix remote identity clustering and pagination"
          git push origin HEAD:codex/song-search-optimization-20260820

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Electron runtime boundary
        run: npm run check:runtime
      - name: Run tests
        run: npm test
