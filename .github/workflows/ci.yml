name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  apply-search-optimization:
    name: Apply indexed search refactor
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/song-search-optimization-20260820'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/song-search-optimization-20260820
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply search refactor
        run: |
          python3 scripts/prepare-search-patch.py
          python3 scripts/apply-search-optimization.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate permanent search files
        run: npm run verify
      - name: Commit validated permanent files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '      - name: Install dependencies\n        run: npm ci --ignore-scripts\n      - name: Run tests\n',
              '      - name: Install dependencies\n        run: npm ci --ignore-scripts\n      - name: Verify Electron runtime boundary\n        run: npm run check:runtime\n      - name: Run tests\n'
          )
          path.write_text(source, encoding='utf-8')
          PY
          git rm --ignore-unmatch \
            .github/workflows/apply-search-optimization.yml \
            scripts/apply-search-optimization.py \
            scripts/prepare-search-patch.py
          git add .github/workflows/ci.yml app/data-store.js app/search-service.js app/music-server.js
          git commit -m "Index and relevance-rank song search"
          git push origin HEAD:codex/song-search-optimization-20260820

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Electron runtime boundary
        run: npm run check:runtime
      - name: Run tests
        run: npm test
